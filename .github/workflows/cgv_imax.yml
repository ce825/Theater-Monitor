name: CGV IMAX/4DX Monitor (구버전 · 폴백)

# IMAX/4DX 감시는 cgv.yml(API 방식)로 통합되었다.
# 이 워크플로는 API가 막혔을 때 수동으로 돌리는 Playwright 폴백으로만 남겨둔다.
# cron-job.org에서 이 워크플로를 트리거하고 있다면 반드시 해제할 것 —
# 그대로 두면 cgv.yml과 중복 알림이 발생한다.
on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright playwright-stealth
          playwright install chromium
          playwright install-deps chromium

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: imax_showings.json
          key: cgv-imax-${{ github.run_id }}
          restore-keys: cgv-imax-

      - name: Run monitor
        run: python cgv_imax_monitor.py

      - name: Upload debug screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshot-imax
          path: debug_screenshot.png
          if-no-files-found: ignore

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: imax_showings.json
          key: cgv-imax-${{ github.run_id }}
