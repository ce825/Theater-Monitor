name: Webhook Health Check (임시 진단)

# 시크릿에 든 웹훅 3개가 유효한지 확인한다.
# 값은 출력하지 않고 HTTP 상태 코드만 찍는다 (200 = 유효, 404 = 삭제된 웹훅).
# 메시지를 보내지 않는 GET 조회라 채널에 흔적이 남지 않는다.
# 확인 후 이 파일은 삭제한다.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check webhooks
        env:
          STAGE: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IMAX: ${{ secrets.IMAX_DISCORD_WEBHOOK_URL }}
          IMAX_OPEN: ${{ secrets.IMAX_OPEN_WEBHOOK_URL }}
        run: |
          for name in STAGE IMAX IMAX_OPEN; do
            url=$(eval echo \$$name)
            if [ -z "$url" ]; then
              echo "CHECK $name = EMPTY"
            else
              echo "CHECK $name = $(curl -s -o /dev/null -w '%{http_code}' "$url")"
            fi
          done
